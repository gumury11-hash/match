<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화투 맞추기</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #1a4d2e;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            margin-bottom: 5px;
        }
        .difficulty-control {
            margin: 8px 0 14px;
            font-weight: bold;
        }
        .difficulty-control select {
            margin-left: 8px;
            padding: 6px 10px;
            border-radius: 5px;
            font: inherit;
        }
        .info-panel {
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap;
        }
        .game-section {
            flex: 1;
            min-width: 600px;
        }
        .stats-sidebar {
            width: 300px;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .stats-sidebar h3 {
            margin-top: 0;
            border-bottom: 1px solid #555;
            padding-bottom: 8px;
            font-size: 1rem;
            color: #f1c40f;
        }
        ol {
            padding-left: 20px;
            margin: 5px 0 15px 0;
            font-size: 0.9rem;
        }
        li {
            margin-bottom: 4px;
        }
        .game-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            max-width: 800px;
            margin: 0 auto;
        }
        @media (max-width: 1000px) {
            .main-container {
                flex-direction: column;
                align-items: center;
            }
            .game-section {
                min-width: 100%;
            }
            .stats-sidebar {
                width: 100%;
                max-width: 800px;
            }
            .game-board {
                grid-template-columns: repeat(6, 1fr);
            }
        }
        @media (max-width: 700px) {
            body {
                padding: 12px 8px 20px;
            }
            h1 {
                font-size: 1.45rem;
                line-height: 1.3;
            }
            .main-container {
                gap: 12px;
            }
            .game-section {
                min-width: 0;
            }
            .info-panel {
                font-size: 0.82rem;
                line-height: 1.5;
            }
            .game-board {
                max-width: 420px;
                gap: 6px;
                grid-template-columns: repeat(6, minmax(0, 1fr));
            }
            .stats-sidebar {
                padding: 12px;
            }
            .card {
                border-radius: 5px;
            }
            .card-front, .card-back {
                border-width: 1.5px;
                border-radius: 5px;
            }
        }
        @media (max-width: 420px) {
            .game-board {
                max-width: 340px;
                gap: 5px;
                grid-template-columns: repeat(5, minmax(0, 1fr));
            }
            .info-panel {
                font-size: 0.75rem;
            }
            #restart-btn {
                width: 100%;
                max-width: 220px;
                padding: 10px 16px;
            }
        }
        .card {
            aspect-ratio: 2 / 3;
            background-color: #f4e8c1;
            border-radius: 6px;
            cursor: pointer;
            perspective: 1000px;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.4s;
            transform-style: preserve-3d;
            border-radius: 6px;
            transform: rotateY(180deg);
        }
        .card.flipped .card-inner, .card.matched .card-inner {
            transform: rotateY(0deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 6px;
            border: 2px solid #b8860b;
            overflow: hidden;
            background: #fffdf0;
        }
        .card-front {
            background: linear-gradient(135deg, #d32f2f 0%, #a51616 100%);
            color: white;
            font-weight: bold;
            font-size: 1.4rem;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }
        .card-back {
            background: linear-gradient(135deg, #fff9db 0%, #f8e9b7 100%);
            color: #333;
            transform: rotateY(180deg);
            padding: 0;
        }
        .sprite-face {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: fill;
        }
        .card-front svg,
        .card-back svg {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 6px;
        }
        .card-back .month,
        .card-back .name {
            display: none;
        }
        #restart-btn {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 1rem;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #replay-btn {
            margin: 20px 8px 0 0; padding: 10px 18px; font-size: 1rem; background: #3498db; color: white; border: 0; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        #replay-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #restart-btn:hover {
            background-color: #d35400;
        }

        /* 밝고 정돈된 테이블 스타일 */
        :root {
            color-scheme: light;
            --ink: #24352c;
            --muted: #66766b;
            --green: #286a4c;
            --green-dark: #1c5038;
            --gold: #d9a83e;
            --surface: rgba(255, 255, 255, 0.94);
        }
        body {
            min-height: 100vh;
            padding: clamp(16px, 3vw, 36px);
            color: var(--ink);
            background:
                radial-gradient(ellipse at 12% 0%, rgba(255,255,255,.95), transparent 42%),
                linear-gradient(145deg, #f5f8ef 0%, #e8f0e5 52%, #f8f3e7 100%);
        }
        h1 {
            margin: 0 0 22px;
            color: var(--green-dark);
            font-size: clamp(1.65rem, 3vw, 2.3rem);
            letter-spacing: -.045em;
        }
        .main-container {
            max-width: 1320px;
            gap: 22px;
            align-items: stretch;
        }
        .game-section, .stats-sidebar {
            padding: clamp(16px, 2.5vw, 28px);
            border: 1px solid rgba(67, 102, 76, .12);
            border-radius: 22px;
            background: var(--surface);
            box-shadow: 0 18px 45px rgba(45, 73, 51, .10), 0 2px 8px rgba(45, 73, 51, .05);
        }
        .game-section {
            min-width: min(600px, 100%);
        }
        .difficulty-control {
            margin: 0 auto 18px;
            color: var(--muted);
        }
        .difficulty-control select {
            border: 1px solid #d6dfd3;
            background-color: #fbfdf9;
            color: var(--ink);
            box-shadow: 0 2px 5px rgba(40, 70, 49, .06);
        }
        .info-panel {
            margin: 0 auto 18px;
            padding: 12px 16px;
            border: 1px solid #e6ecdf;
            border-radius: 14px;
            background: #f6f9f2;
            color: #425448;
            font-size: .98rem;
            line-height: 1.8;
        }
        #game-status { color: #a46c0a !important; }
        .game-board {
            max-width: 880px;
            gap: clamp(5px, 1vw, 10px);
            padding: clamp(8px, 1.5vw, 14px);
            border: 1px solid #e4eadc;
            border-radius: 18px;
            background: linear-gradient(145deg, #edf4e9, #e5eee2);
            box-shadow: inset 0 2px 8px rgba(55, 82, 60, .06);
        }
        .card {
            border: 2px solid #fff;
            border-radius: 9px;
            background: #fffdf5;
            box-shadow: 0 5px 12px rgba(45, 57, 42, .18), 0 1px 3px rgba(45, 57, 42, .12);
            transition: transform .18s ease, box-shadow .18s ease;
        }
        .card:not(.matched):hover {
            z-index: 1;
            transform: translateY(-2px);
            box-shadow: 0 9px 18px rgba(45, 57, 42, .23);
        }
        .card-front, .card-back {
            border: 2px solid #d8aa43;
            border-radius: 7px;
            background-color: #fffdf5;
        }
        .sprite-face { border-radius: 5px; }
        .stats-sidebar {
            flex: 0 0 270px;
            width: auto;
            color: var(--ink);
            text-align: left;
        }
        .stats-sidebar h3 {
            margin: 0 0 12px;
            padding: 0 0 10px;
            border-bottom: 1px solid #e5ebdf;
            color: var(--green);
            font-size: 1rem;
        }
        .stats-sidebar p { color: var(--muted); line-height: 1.6; }
        .stats-sidebar ol { padding-left: 24px; color: #425448; }
        #replay-btn, #restart-btn {
            min-height: 44px;
            margin-top: 16px;
            border-radius: 12px;
            box-shadow: 0 5px 12px rgba(30, 75, 51, .14);
            transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
        }
        #replay-btn { background: #4a8caa; }
        #restart-btn { background: linear-gradient(135deg, #34835c, #246746); }
        #replay-btn:not(:disabled):hover, #restart-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.06);
            box-shadow: 0 8px 16px rgba(30, 75, 51, .2);
        }
        button:focus-visible, select:focus-visible {
            outline: 3px solid rgba(54, 132, 92, .35);
            outline-offset: 3px;
        }
        @media (max-width: 1000px) {
            .game-section { min-width: 0; width: 100%; box-sizing: border-box; }
            .stats-sidebar { flex: auto; box-sizing: border-box; }
        }
        @media (max-width: 700px) {
            body { padding: 16px 10px 24px; }
            h1 { margin-bottom: 16px; }
            .game-section, .stats-sidebar { padding: 14px; border-radius: 18px; }
            .info-panel { font-size: .82rem; }
            .game-board { border-radius: 14px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
        #fireworks-canvas {
            position: fixed;
            inset: 0;
            z-index: 80;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .celebration-overlay[hidden] { display: none; }
        .celebration-overlay {
            position: fixed;
            inset: 0;
            z-index: 90;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(24, 47, 34, .42);
            backdrop-filter: blur(5px);
        }
        .celebration-dialog {
            width: min(420px, 100%);
            box-sizing: border-box;
            padding: clamp(26px, 6vw, 42px);
            border: 1px solid rgba(255, 255, 255, .8);
            border-radius: 26px;
            background: linear-gradient(145deg, #fffef9, #f4f8ee);
            box-shadow: 0 24px 80px rgba(13, 43, 27, .3);
            color: #26382d;
            text-align: center;
            animation: celebration-pop .4s cubic-bezier(.2,.8,.2,1) both;
        }
        .celebration-icon { margin-bottom: 8px; font-size: 3.2rem; line-height: 1; }
        .celebration-dialog h2 {
            margin: 0 0 10px;
            color: #246746;
            font-size: clamp(1.55rem, 6vw, 2rem);
        }
        .celebration-dialog p { margin: 0 0 20px; color: #66766b; line-height: 1.65; }
        .celebration-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 0 0 24px;
        }
        .celebration-stat {
            padding: 12px 6px;
            border: 1px solid #e6ecdf;
            border-radius: 14px;
            background: #f8faf5;
        }
        .celebration-stat strong { display: block; color: #246746; font-size: 1.2rem; }
        .celebration-stat span { color: #78877b; font-size: .78rem; }
        #celebration-close {
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 13px;
            background: linear-gradient(135deg, #34835c, #246746);
            box-shadow: 0 6px 16px rgba(36, 103, 70, .2);
            color: white;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }
        @keyframes celebration-pop {
            from { opacity: 0; transform: translateY(12px) scale(.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @media (prefers-reduced-motion: reduce) {
            .celebration-dialog { animation: none; }
        }
        .stats-overlay[hidden] { display: none; }
        .stats-overlay {
            position: fixed;
            inset: 0;
            z-index: 70;
            display: grid;
            place-items: center;
            padding: 18px;
            background: rgba(24, 47, 34, .42);
            backdrop-filter: blur(5px);
        }
        .stats-dialog {
            position: relative;
            width: min(520px, 100%);
            max-height: min(82vh, 760px);
            overflow: auto;
            box-sizing: border-box;
            padding: 26px;
            border: 1px solid rgba(255, 255, 255, .85);
            border-radius: 22px;
            background: #fffefa;
            box-shadow: 0 24px 80px rgba(13, 43, 27, .28);
            color: #24352c;
            text-align: left;
            animation: celebration-pop .28s ease-out both;
        }
        .stats-dialog .stats-sidebar { width: auto; padding: 0; border: 0; box-shadow: none; background: transparent; }
        .stats-dialog h2 { margin: 0 42px 20px 0; color: #246746; font-size: 1.45rem; }
        .stats-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 50%;
            background: #eef4eb;
            color: #405447;
            cursor: pointer;
            font-size: 1.4rem;
        }
        #stats-btn {
            min-height: 44px;
            margin: 16px 8px 0 0;
            padding: 10px 18px;
            border: 0;
            border-radius: 12px;
            background: #e8f0e5;
            box-shadow: 0 4px 10px rgba(30, 75, 51, .1);
            color: #286a4c;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }
        #stats-btn:hover, .stats-close:hover { filter: brightness(.96); }
        @media (max-width: 700px) {
            .stats-dialog { padding: 20px; border-radius: 18px; }
        }
    </style>
</head>
<body>

    <canvas id="fireworks-canvas" aria-hidden="true"></canvas>
    <div id="celebration" class="celebration-overlay" role="dialog" aria-modal="true" aria-labelledby="celebration-title" hidden>
        <div class="celebration-dialog">
            <div class="celebration-icon" aria-hidden="true">🎉</div>
            <h2 id="celebration-title">완벽한 기억력이에요!</h2>
            <p>모든 화투 짝을 찾았어요.<br>멋진 플레이를 축하합니다!</p>
            <div class="celebration-stats">
                <div class="celebration-stat"><strong id="celebration-time">0초</strong><span>완료 시간</span></div>
                <div class="celebration-stat"><strong id="celebration-fails">0회</strong><span>실패</span></div>
                <div class="celebration-stat"><strong id="celebration-replays">0회</strong><span>다시보기</span></div>
            </div>
            <button id="celebration-close" type="button" onclick="closeCelebration()">계속하기</button>
        </div>
    </div>

    <h1>화투 맞추기</h1>

    <div class="main-container">
        <!-- 게임 보드와 난이도 설정 -->
        <div class="game-section">
                        <div class="difficulty-control">
                <label for="set-count">난이도:</label>
                <select id="set-count" onchange="changeDifficulty()">
                    <option value="3" selected>3세트</option>
                    <option value="4">4세트</option>
                    <option value="5">5세트</option>
                    <option value="6">6세트</option>
                    <option value="7">7세트</option>
                    <option value="8">8세트</option>
                    <option value="9">9세트</option>
                    <option value="10">10세트</option>
                    <option value="11">11세트</option>
                    <option value="12">12세트</option>
                </select>
            </div>
            <div class="info-panel">
                상태: <span id="game-status" style="color: #f1c40f; font-weight: bold;">처음 3초 기억하세요</span> | 짝 <span id="pairs-left">24</span> | 실패: <span id="fails">0</span>회 | 시간: <span id="timer">0</span>초 | 다시보기: <span id="replay-count">0</span>회
            </div>

            <div class="game-board" id="game-board"></div>
            
            <button id="replay-btn" onclick="replayCards()" disabled>다시보기</button>
            <button id="restart-btn" onclick="startGame()">실행</button>
            <button id="stats-btn" type="button" onclick="openStats()">통계</button>
        </div>
    </div>

    <div id="stats-modal" class="stats-overlay" role="dialog" aria-modal="true" aria-labelledby="stats-title" hidden onclick="if (event.target === this) closeStats()">
        <div class="stats-dialog">
            <button class="stats-close" type="button" aria-label="통계 닫기" onclick="closeStats()">&times;</button>
            <h2 id="stats-title">게임 통계</h2>
            <div class="stats-sidebar">
                <h3>다시보기 통계</h3>
                <p>통계 기준 세트: <span id="stats-set-count">12</span></p>
                <p>완료 게임 누적: <span id="total-replays">0</span>회</p>
                <h3>최단 시간 기록 (Top 10)</h3>
                <ol id="time-ranking"><li>기록 없음</li></ol>
                <h3>최소 실패 기록 (Top 10)</h3>
                <ol id="fail-ranking"><li>기록 없음</li></ol>
            </div>
        </div>
    </div>

    <script>
        const hwatooData = [
            { month: 1, name: 'm1c1' }, { month: 1, name: 'm1c2' }, { month: 1, name: 'm1c3' }, { month: 1, name: 'm1c4' },
            { month: 2, name: 'm2c1' }, { month: 2, name: 'm2c2' }, { month: 2, name: 'm2c3' }, { month: 2, name: 'm2c4' },
            { month: 3, name: 'm3c1' }, { month: 3, name: 'm3c2' }, { month: 3, name: 'm3c3' }, { month: 3, name: 'm3c4' },
            { month: 4, name: 'm4c1' }, { month: 4, name: 'm4c2' }, { month: 4, name: 'm4c3' }, { month: 4, name: 'm4c4' },
            { month: 5, name: 'm5c1' }, { month: 5, name: 'm5c2' }, { month: 5, name: 'm5c3' }, { month: 5, name: 'm5c4' },
            { month: 6, name: 'm6c1' }, { month: 6, name: 'm6c2' }, { month: 6, name: 'm6c3' }, { month: 6, name: 'm6c4' },
            { month: 7, name: 'm7c1' }, { month: 7, name: 'm7c2' }, { month: 7, name: 'm7c3' }, { month: 7, name: 'm7c4' },
            { month: 8, name: 'm8c1' }, { month: 8, name: 'm8c2' }, { month: 8, name: 'm8c3' }, { month: 8, name: 'm8c4' },
            { month: 9, name: 'm9c1' }, { month: 9, name: 'm9c2' }, { month: 9, name: 'm9c3' }, { month: 9, name: 'm9c4' },
            { month: 10, name: 'm10c1' }, { month: 10, name: 'm10c2' }, { month: 10, name: 'm10c3' }, { month: 10, name: 'm10c4' },
            { month: 11, name: 'm11c1' }, { month: 11, name: 'm11c2' }, { month: 11, name: 'm11c3' }, { month: 11, name: 'm11c4' },
            { month: 12, name: 'm12c1' }, { month: 12, name: 'm12c2' }, { month: 12, name: 'm12c3' }, { month: 12, name: 'm12c4' }
        ];

        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let fails = 0;
        let timer = 0;
        let timerInterval = null;
        let replayCount = 0;
        let replayTimeout = null;
        let revealTimeout = null;
        let selectedSets = 12;
        let selectedSetIds = [];
        let totalPairs = 24;
        let isPlaying = false;
        let isLocked = true;
        let fireworksFrame = null;

        // 저장된 게임 기록을 불러옵니다.
        let records = [];
        try {
            const savedRecords = JSON.parse(localStorage.getItem("hwatoo_records"));
            if (Array.isArray(savedRecords)) records = savedRecords;
        } catch (error) {
            records = [];
        }
        const REVEAL_MS = 3000;

        function updateRankingsUI() {
            const selectedRecords = records.filter(record => (Number(record.sets) || 12) === selectedSets);
            const totalReplays = selectedRecords.reduce((sum, record) => sum + (Number(record.replays) || 0), 0);
            document.getElementById("stats-set-count").innerText = selectedSets;
            document.getElementById("total-replays").innerText = totalReplays;
            const timeListEl = document.getElementById('time-ranking');
            const failListEl = document.getElementById('fail-ranking');

            // 완료 시간 순위 상위 10개를 표시합니다.
            const timeSorted = [...selectedRecords].sort((a, b) => a.time - b.time).slice(0, 10);
            // 실패 횟수 순위 상위 10개를 표시합니다.
            const failSorted = [...selectedRecords].sort((a, b) => a.fails - b.fails).slice(0, 10);

            // 완료 시간 기록을 표시합니다.
            if (timeSorted.length === 0) {
                timeListEl.innerHTML = '<li>기록 없음</li>';
            } else {
                timeListEl.innerHTML = timeSorted.map(r => `<li>${r.time}초 | 실패 ${r.fails}회 | 다시보기 ${r.replays || 0}회</li>`).join("");
            }

            // 실패 횟수 기록을 표시합니다.
            if (failSorted.length === 0) {
                failListEl.innerHTML = '<li>기록 없음</li>';
            } else {
                failListEl.innerHTML = failSorted.map(r => `<li>실패 ${r.fails}회 | ${r.time}초 | 다시보기 ${r.replays || 0}회</li>`).join("");
            }
        }

        function stopFireworks() {
            if (fireworksFrame !== null) cancelAnimationFrame(fireworksFrame);
            fireworksFrame = null;
            const canvas = document.getElementById('fireworks-canvas');
            const context = canvas.getContext('2d');
            context.clearRect(0, 0, canvas.width, canvas.height);
        }

        function launchFireworks() {
            stopFireworks();
            const canvas = document.getElementById('fireworks-canvas');
            const context = canvas.getContext('2d');
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reducedMotion) return;

            const scale = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.floor(window.innerWidth * scale);
            canvas.height = Math.floor(window.innerHeight * scale);
            context.setTransform(scale, 0, 0, scale, 0, 0);

            const particles = [];
            const colors = ['#f5bd45', '#f36d67', '#65bda0', '#8b83e8', '#fff1a6'];
            const startedAt = performance.now();
            let lastBurstAt = -500;

            function burst() {
                const x = window.innerWidth * (.15 + Math.random() * .7);
                const y = window.innerHeight * (.12 + Math.random() * .43);
                const color = colors[Math.floor(Math.random() * colors.length)];
                const count = 46;
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 * i) / count + Math.random() * .08;
                    const speed = 1.4 + Math.random() * 4.1;
                    particles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        gravity: .045 + Math.random() * .035,
                        life: 55 + Math.random() * 35,
                        size: 1.5 + Math.random() * 2.2,
                        color
                    });
                }
            }

            function draw(now) {
                const elapsed = now - startedAt;
                context.clearRect(0, 0, window.innerWidth, window.innerHeight);
                if (elapsed < 3800 && now - lastBurstAt > 420) {
                    burst();
                    lastBurstAt = now;
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const particle = particles[i];
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.vy += particle.gravity;
                    particle.vx *= .99;
                    particle.life--;
                    if (particle.life <= 0) {
                        particles.splice(i, 1);
                        continue;
                    }
                    context.globalAlpha = Math.min(1, particle.life / 25);
                    context.fillStyle = particle.color;
                    context.beginPath();
                    context.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    context.fill();
                }
                context.globalAlpha = 1;

                if (elapsed < 4800 || particles.length) {
                    fireworksFrame = requestAnimationFrame(draw);
                } else {
                    stopFireworks();
                }
            }

            fireworksFrame = requestAnimationFrame(draw);
        }

        function changeDifficulty() {
            selectedSets = Number(document.getElementById("set-count").value) || 12;
            updateRankingsUI();
            startGame();
        }

        function startGame() {
            closeCelebration();
            clearInterval(timerInterval);
            clearTimeout(replayTimeout);
            replayTimeout = null;
            clearTimeout(revealTimeout);
            revealTimeout = null;
            selectedSets = Number(document.getElementById("set-count").value) || 12;
            totalPairs = selectedSets * 2;
            updateRankingsUI();
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            flippedCards = [];
            matchedPairs = 0;
            fails = 0;
            timer = 0;
            isPlaying = false;
            isLocked = true;

            document.getElementById('fails').innerText = fails;
            document.getElementById('pairs-left').innerText = totalPairs;
            document.getElementById('timer').innerText = timer;
            replayCount = 0;
            document.getElementById("replay-count").innerText = replayCount;
            document.getElementById("replay-btn").disabled = true;
            document.getElementById('game-status').innerText = "3 초 동안 카드 위치를 기억하세요";
            document.getElementById('game-status').style.color = "#f1c40f";

            // 월별 네 장의 카드로 세트를 구성합니다.
            const cardsByMonth = new Map();
            hwatooData.forEach((card, index) => {
                if (!cardsByMonth.has(card.month)) cardsByMonth.set(card.month, []);
                const monthCards = cardsByMonth.get(card.month);
                monthCards.push({ ...card, id: index, cardInMonth: monthCards.length });
            });

            // Only complete four-card months are eligible as sets.
            const availableSetIds = [...cardsByMonth.entries()]
                .filter(([, monthCards]) => monthCards.length === 4)
                .map(([month]) => month);
            for (let i = availableSetIds.length - 1; i > 0; i--) {
                const randomIndex = Math.floor(Math.random() * (i + 1));
                [availableSetIds[i], availableSetIds[randomIndex]] = [availableSetIds[randomIndex], availableSetIds[i]];
            }
            selectedSetIds = availableSetIds.slice(0, Math.min(selectedSets, availableSetIds.length));
            cards = selectedSetIds.flatMap(month => cardsByMonth.get(month));
            for (let i = cards.length - 1; i > 0; i--) {
                const randomIndex = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[randomIndex]] = [cards[randomIndex], cards[i]];
            }

            // 카드를 보드에 추가하고 앞면 이미지를 설정합니다.
            cards.forEach((cardData) => {
                const card = document.createElement('div');
                card.classList.add('card', 'flipped');
                card.dataset.month = cardData.month;
                card.dataset.pair = cardData.month;
                card.dataset.id = cardData.id;
                const artwork = createCardArtwork(cardData);

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">${artwork.front}</div>
                        <div class="card-back">${artwork.back}</div>
                    </div>
                `;

                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });

            // 3초 동안 카드 위치를 보여준 뒤 카드를 뒤집습니다.
            revealTimeout = setTimeout(() => {
                const allCards = document.querySelectorAll('.card');
                allCards.forEach(card => {
                    if (!card.classList.contains('matched')) {
                        card.classList.remove('flipped');
                    }
                });

                document.getElementById('game-status').innerText = "게임 진행 중";
                document.getElementById('game-status').style.color = "#2ecc71";
                revealTimeout = null;
                isLocked = false;
                isPlaying = true;
                updateReplayButton();

                timerInterval = setInterval(() => {
                    timer++;
                    document.getElementById('timer').innerText = timer;
                }, 1000);
            }, REVEAL_MS);
        }

        function flipCard() {
            if (!isPlaying || isLocked) return;
            if (this.classList.contains('flipped') || this.classList.contains('matched')) return;

            this.classList.add('flipped');
            flippedCards.push(this);
            updateReplayButton();

            if (flippedCards.length === 2) {
                checkForMatch();
            }
        }

        function checkForMatch() {
            const [card1, card2] = flippedCards;
            const match = card1.dataset.pair === card2.dataset.pair;

            if (match) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                document.getElementById('pairs-left').innerText = totalPairs - matchedPairs;
                flippedCards = [];
                updateReplayButton();

                if (matchedPairs === totalPairs) {
                    clearInterval(timerInterval);
                    isPlaying = false;
                    updateReplayButton();
                    
                    // 제한 시간이 끝나면 게임을 종료합니다.
                    records.push({ time: timer, fails: fails, replays: replayCount, sets: selectedSets, date: new Date().toLocaleDateString() });
                    try {
                        localStorage.setItem("hwatoo_records", JSON.stringify(records));
                    } catch (error) {
                        // Continue the game even if local storage is unavailable.
                    }
                    updateRankingsUI();

                    document.getElementById('game-status').innerText = "완료! 모든 짝을 찾았어요.";
                    document.getElementById('game-status').style.color = "#246746";
                    showCelebration();
                }
            } else {
                fails++;
                document.getElementById('fails').innerText = fails;
                isLocked = true;

                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    isLocked = false;
                    updateReplayButton();
                }, 800);
            }
        }

        // 난이도 선택 변경을 감지하면 새 게임을 시작합니다.
        function updateReplayButton() {
            const button = document.getElementById("replay-btn");
            if (button) button.disabled = !isPlaying || isLocked || flippedCards.length > 0;
        }

        function replayCards() {
            if (!isPlaying || isLocked || flippedCards.length > 0) return;
            replayCount++;
            document.getElementById("replay-count").innerText = replayCount;
            isLocked = true;
            updateReplayButton();
            document.querySelectorAll(".card").forEach(card => {
                if (!card.classList.contains("matched")) card.classList.add("flipped");
            });
            replayTimeout = setTimeout(() => {
                document.querySelectorAll(".card").forEach(card => {
                    if (!card.classList.contains("matched")) card.classList.remove("flipped");
                });
                replayTimeout = null;
                isLocked = false;
                    updateReplayButton();
            }, REPLAY_MS);
        }
        startGame();
    </script>

</body>
</html>
